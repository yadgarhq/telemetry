[package]
name = "yadgar-telemetry"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "D67's instrumentation seam: spans, wide events, bounded metrics, and the calibrated token estimator."

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# The metrics FACADE only. A library that installs an exporter decides the
# backend for every service that links it; the binary installs one (see
# `metrics::install_prometheus`) so the choice stays with the deployment.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }

# OPTIONAL, behind the `grpc` feature. The crate stays transport-agnostic by
# default — a job or a hook emitting records must not pull a gRPC stack — while
# every gRPC service shares ONE status mapping instead of writing its own.
tonic = { version = "0.14", default-features = false, optional = true }

[features]
default = []
grpc = ["dep:tonic"]

[build-dependencies]
tonic-prost-build = "0.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The tests read what was emitted rather than asserting it did not panic, so
# they need the JSON back as values — that is what pins `Wire`'s field mapping,
# where transposing user_id and project_id is otherwise invisible.
serde_json = "1"
# `DebuggingRecorder` + `with_local_recorder`: the only way to assert that the
# metric NAMES a dashboard queries, and the value the bytes counter actually
# receives, are what this crate claims. MUST resolve against metrics 0.24 — a
# metrics-util built on another major links a SECOND facade, and then the
# snapshot is empty while every assertion still compiles and passes.
metrics-util = { version = "0.20", features = ["debugging"] }
# A feature-gated test target needs the optional dependency nameable from the
# test itself; `--all-features` enables the feature but does not make an
# optional dependency a dev-dependency.
tonic = { version = "0.14", default-features = false }

# `cargo test --all-features` (what CI runs) builds this. A plain `cargo test`
# SKIPS it rather than failing to compile — the alternative is making `grpc` a
# default feature, which would drag a gRPC stack into every job and hook that
# emits a record, and the crate is transport-agnostic on purpose.
[[test]]
name = "grpc"
required-features = ["grpc"]
