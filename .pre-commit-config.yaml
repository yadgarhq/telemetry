# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that HAPPEN to look like YAML —
        # `{{- toYaml ... }}` is a syntax error to any real parser. Excluding
        # them is not lowering the bar: `helm lint` and `helm template` are the
        # checks that actually apply, and they run in CI.
        exclude: ^chart/templates/
      - id: check-toml

  # Shared, from yadgarhq/actions (D62). IMMUTABLE rev: pre-commit caches a rev
  # at first install and never re-resolves it, so a moving tag would silently
  # freeze each machine at whatever it meant the day it first ran.
  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.0
    hooks:
      - id: gitleaks
      - id: prettier
        exclude: ^(chart/templates/|proto/)
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. This repository has a
      # `.github/workflows/` and nothing read it: `ci-pr.yaml` installs the
      # `actionlint` binary unconditionally and `yadgarhq/actions` publishes the
      # hook, but publication makes a check AVAILABLE rather than switching it on
      # (ledger 620, ADR-0577).
      #
      # The hook REFUSES rather than passes when actionlint's shellcheck rule
      # class is not running: actionlint silently disables that whole class when
      # the binary is absent, and "Passed, having checked nothing" is the defect
      # the guard closes rather than a state this check may report.
      - id: actionlint
      - id: cargo-fmt
      - id: cargo-clippy
      # LEDGER 659. `complexity` and `cargo-clippy-complexity` have been published
      # in yadgarhq/actions since before v1.13.1 and were referenced by exactly
      # ONE repository in the estate. A published hook nobody references gates
      # nothing (ADR-0577), so these two were a shared ceiling in name only.
      #
      # ADOPTED HERE BECAUSE THIS REPOSITORY IS CLEAN, measured 2026-09-06 rather
      # than hoped: `complexity.py` reports no file over the 500-line ceiling and
      # no function over 120, and `cargo clippy --all-targets --all-features --
      # -W clippy::cognitive_complexity -W clippy::too_many_arguments -D warnings`
      # exits 0. Adopting now costs this repository nothing and is the only
      # moment it is free. `complexity.py`'s own header makes the argument:
      # adopting a limit once it is already breached means starting with an
      # exemption list, which is how the limit stops meaning anything.
      #
      # THE ESTATE IS NOT ADOPTING THIS WHOLESALE, and that is deliberate rather
      # than an oversight to correct later. The same measurement over the other
      # Rust repositories found gateway 8 files and 5 functions over the
      # ceilings, iam 7 and 5, iam-db 3 and 5, task-db 3 and 2, task 2 and 2,
      # project-db 2 and 2, dial 1 and 0, lifecycle 1 and 0. Turning these on
      # there blocks every commit in eight repositories, which is a ruling about
      # a refactor budget and not a hook adoption. It is filed as one.
      #
      # The two are complementary and neither replaces the other: a line count
      # cannot see nesting, and cognitive complexity cannot see a 2000-line file
      # of short functions.
      - id: complexity
      - id: cargo-clippy-complexity
      - id: cargo-deny
      # ADR-0569's gate (ledger 648), published in v1.15.0. This repository
      # never carried the byte-identical local copy the five service
      # repositories did, so this is a plain new-id adoption.
      - id: no-compiled-in-defaults
      # D67 handler instrumentation, adopted for CLASS UNIFORMITY. Measured
      # 2026-09-09 this crate DEFINES `observe::Call` but declares no tonic
      # server trait and no `Router::new()` of its own, so the gate judges zero
      # handlers here and reports a pass. It arms the day this crate grows a
      # handler.
      - id: observe-coverage
      # LEDGER 658. Adopted though it checks nothing today: the largest `run:`
      # block outside yadgarhq/actions is 303 bytes against an 8000-byte limit,
      # and this repository measures 0. It is a tripwire for a block someone
      # writes later, not a fix for anything present now.
      - id: run-block-size
      # LEDGER 837. The hook refuses a test that stops running rather than
      # fails: a skip marker, an unsatisfiable `cfg`, an environment-probe
      # guard as a test's first statement, a narrowed `cargo test`/pytest
      # invocation, or a captured run whose exit code got suppressed.
      # Publishing this in yadgarhq/actions did not gate telemetry —
      # ADR-0577 — so this line is the part that does. The rev bump also
      # carries v1.19.0's `observe-coverage` tightening, which finds nothing
      # to refuse here.
      - id: no-test-skips
